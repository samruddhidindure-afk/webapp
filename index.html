<!DOCTYPE html>
<html lang="en">

<head>

    <title>div task</title>
    <style>
        .traffic-light{
        background-color: #222;
        margin: 50px auto;
        height: 250PX;
        width: 100px;
        border-radius: 20px;
        padding: 15px;

    }
    .light{
         
       
        width: 60px;
        height: 60PX;
        border-radius: 50%;
        margin: 15px auto;
       

    }
     .red{ 
         background-color: red;
         
    }
     .yellow{ 
         background-color: yellow
        
     }
      .green{ 
         background-color: green
        
     }
    </style>
</head>

<body>
    <div class="traffic-light">
        


        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
    </div>

</body>

</html>
